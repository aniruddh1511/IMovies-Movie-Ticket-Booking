<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IMovies - Cinematic Demo Video & Interactive Walkthrough</title>
  <link rel="icon" type="image/svg+xml" href="phonepe-qr.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#f43f5e', 600: '#e11d48', 700: '#be123c' },
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        },
      },
    };
  </script>
  <style>
    body { background-color: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; }
    .video-shadow { box-shadow: 0 25px 60px -15px rgba(244, 63, 94, 0.25), 0 0 100px -20px rgba(15, 23, 42, 0.9); }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col items-center justify-center p-3 sm:p-6 selection:bg-rose-500 selection:text-white">

  <!-- Header Banner -->
  <header class="w-full max-w-5xl flex items-center justify-between pb-4 mb-4 border-b border-slate-800">
    <div className="flex items-center gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-600 via-rose-500 to-amber-500 flex items-center justify-center shadow-lg shadow-rose-900/30">
          <span class="text-xl">🎬</span>
        </div>
        <div>
          <div class="text-xl font-black text-white flex items-center gap-1">
            I<span class="text-rose-500">MOVIES</span>
            <span class="text-xs px-2 py-0.5 rounded-md bg-rose-500/20 text-rose-400 font-bold border border-rose-500/30 ml-2">DEMO VIDEO</span>
          </div>
          <p class="text-[11px] text-slate-400">Cinematic Platform Feature Walkthrough & Recording</p>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <a
        href="index.html"
        class="px-3.5 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs font-semibold text-slate-300 transition-all flex items-center gap-1.5"
      >
        <span>🌐</span>
        <span>Open Live Website</span>
      </a>
    </div>
  </header>

  <!-- Video Player Container -->
  <main class="w-full max-w-5xl flex flex-col items-center">
    <div class="relative w-full aspect-video rounded-3xl overflow-hidden bg-slate-900 border border-slate-800 video-shadow group">
      <!-- High-Resolution Canvas (1920 x 1080) -->
      <canvas id="demoCanvas" width="1920" height="1080" class="w-full h-full object-contain block bg-slate-950"></canvas>

      <!-- Center Play Overlay when Paused -->
      <div id="playOverlay" class="absolute inset-0 bg-slate-950/60 backdrop-blur-sm flex flex-col items-center justify-center cursor-pointer transition-opacity duration-300">
        <button id="bigPlayBtn" class="w-20 h-20 rounded-full bg-rose-600 hover:bg-rose-500 text-white flex items-center justify-center shadow-2xl shadow-rose-900/80 hover:scale-110 active:scale-95 transition-all mb-4">
          <svg class="w-8 h-8 fill-current ml-1" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </button>
        <span class="text-base font-bold text-white tracking-wide">Watch IMovies Demo Walkthrough</span>
        <span class="text-xs text-slate-400 mt-1">Full-stack booking experience • Rachit Banke QR checkout • E-tickets</span>
      </div>

      <!-- Subtitle & Action Notification Strip -->
      <div id="captionBanner" class="absolute bottom-16 left-6 right-6 pointer-events-none transition-all duration-300 flex justify-center">
        <div class="bg-slate-950/85 backdrop-blur-md px-5 py-2 rounded-2xl border border-slate-700/80 shadow-2xl text-xs sm:text-sm font-semibold text-white max-w-2xl text-center flex items-center gap-2">
          <span id="captionIcon" class="text-rose-500">✨</span>
          <span id="captionText">Initializing IMovies Cinematic Experience...</span>
        </div>
      </div>
    </div>

    <!-- Video Controls Bar -->
    <div class="w-full mt-4 p-4 rounded-2xl bg-slate-900/90 border border-slate-800 shadow-xl space-y-3">
      <!-- Progress Scrub Bar -->
      <div class="relative w-full flex items-center group">
        <input
          id="timeSlider"
          type="range"
          min="0"
          max="100"
          value="0"
          step="0.1"
          class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-rose-500 focus:outline-none"
        />
      </div>

      <!-- Button Controls Strip -->
      <div class="flex flex-wrap items-center justify-between gap-3 text-xs">
        <div class="flex items-center gap-3">
          <!-- Play / Pause -->
          <button id="playPauseBtn" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 font-bold text-white shadow-md flex items-center gap-1.5 transition-all">
            <span id="playPauseIcon">▶</span>
            <span id="playPauseText">Play Demo</span>
          </button>

          <!-- Replay -->
          <button id="restartBtn" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 font-semibold text-slate-300 hover:text-white transition-colors" title="Restart Demo">
            ↺ Restart
          </button>

          <!-- Time Display -->
          <div class="text-xs font-mono text-slate-400">
            <span id="currentTime" class="text-white font-bold">00:00</span> / <span id="totalDuration">01:30</span>
          </div>
        </div>

        <!-- Chapters Selector -->
        <div class="flex items-center gap-1 overflow-x-auto text-[11px]">
          <span class="text-slate-500 font-bold mr-1">Jump to:</span>
          <button class="chapter-btn px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300" data-time="0">1. Hero</button>
          <button class="chapter-btn px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300" data-time="15">2. Discovery</button>
          <button class="chapter-btn px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300" data-time="30">3. Details</button>
          <button class="chapter-btn px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300" data-time="48">4. Seat Map</button>
          <button class="chapter-btn px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300" data-time="68">5. QR Payment</button>
          <button class="chapter-btn px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300" data-time="82">6. E-Ticket</button>
        </div>

        <!-- Right Side: Export / Download Video File -->
        <div class="flex items-center gap-2">
          <button id="downloadVideoBtn" class="px-4 py-2 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold shadow-lg shadow-emerald-950/50 flex items-center gap-2 transition-all">
            <span>💾</span>
            <span id="recordStatusText">Download Video (.webm)</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Script: High-Fidelity 60FPS Video Canvas Renderer & Recorder -->
  <script>
    const canvas = document.getElementById('demoCanvas');
    const ctx = canvas.getContext('2d');
    const timeSlider = document.getElementById('timeSlider');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playPauseText = document.getElementById('playPauseText');
    const playPauseIcon = document.getElementById('playPauseIcon');
    const bigPlayBtn = document.getElementById('bigPlayBtn');
    const playOverlay = document.getElementById('playOverlay');
    const restartBtn = document.getElementById('restartBtn');
    const currentTimeEl = document.getElementById('currentTime');
    const totalDurationEl = document.getElementById('totalDuration');
    const captionText = document.getElementById('captionText');
    const captionIcon = document.getElementById('captionIcon');
    const downloadVideoBtn = document.getElementById('downloadVideoBtn');
    const recordStatusText = document.getElementById('recordStatusText');

    const TOTAL_SECONDS = 90;
    let currentSeconds = 0;
    let isPlaying = false;
    let lastTimestamp = 0;
    let animationFrameId = null;

    // Load External Image Assets for Canvas
    const qrImage = new Image();
    qrImage.src = 'payment-qr.png';

    const odysseyPoster = new Image();
    odysseyPoster.src = 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=800&auto=format&fit=crop&q=80';

    const odysseyBanner = new Image();
    odysseyBanner.src = 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1600&auto=format&fit=crop&q=80';

    const dhurandharPoster = new Image();
    dhurandharPoster.src = 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=800&auto=format&fit=crop&q=80';

    const interstellarPoster = new Image();
    interstellarPoster.src = 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=800&auto=format&fit=crop&q=80';

    // MediaRecorder Video Capturing Engine
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    // Format Seconds to MM:SS
    function formatTime(s) {
      const mins = Math.floor(s / 60);
      const secs = Math.floor(s % 60);
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // Audio Chime Synthesizer using Web Audio API
    let audioCtx = null;
    function playBeep(freq = 600, duration = 0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // Easing function for smooth animations
    function easeInOutQuad(t) {
      return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    }

    // ========================================================
    // RENDER SCENES ENGINE (1920 x 1080 Full HD Canvas)
    // ========================================================
    function renderFrame(time) {
      ctx.clearRect(0, 0, 1920, 1080);
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, 1920, 1080);

      // Top Persistent Header (1920 width)
      drawTopNavbar();

      if (time < 15) {
        // Scene 1: Hero Banner & Spotlight
        renderHeroScene(time);
        setCaption('✨ Spotlight Premiere: Exploring "The Odyssey" with 4K IMAX Laser & Dolby Atmos', '🎬');
      } else if (time < 30) {
        // Scene 2: Discovery, Ranking Chart & Filters
        renderDiscoveryScene(time - 15);
        setCaption('🔍 Search & Filter: Filtering by Genre & Curated Editor Popularity Rankings', '📊');
      } else if (time < 48) {
        // Scene 3: In-App Movie Details & Showtimes
        renderMovieDetailsScene(time - 30);
        setCaption('📅 In-App Details: Multi-hall scheduling at PVR ICON Palladium without opening new tabs', '🍿');
      } else if (time < 68) {
        // Scene 4: Interactive Auditorium Seat Map
        renderSeatMapScene(time - 48);
        setCaption('💺 Interactive Seat Map: Selecting Recliner/Prime seats C5 & C6 with live price calculation', '🎟️');
      } else if (time < 82) {
        // Scene 5: Checkout & Rachit Banke UPI QR Code Payment
        renderCheckoutQRScene(time - 68);
        setCaption('💳 UPI Payment: Scanning Rachit Banke QR code & verifying 12-digit UTR on server', '⚡');
      } else {
        // Scene 6: Confirmed Digital E-Ticket & My Tickets
        renderTicketConfirmationScene(time - 82);
        setCaption('🎉 Booking Confirmed: Digital boarding pass issued with instant entry QR & reference ID', '✅');
      }
    }

    function setCaption(text, icon = '🎬') {
      captionText.innerText = text;
      captionIcon.innerText = icon;
    }

    // Draw Navbar on Canvas
    function drawTopNavbar() {
      ctx.fillStyle = '#090d16';
      ctx.fillRect(0, 0, 1920, 100);
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 100);
      ctx.lineTo(1920, 100);
      ctx.stroke();

      // Logo
      ctx.fillStyle = '#e11d48';
      ctx.beginPath();
      ctx.roundRect(80, 20, 60, 60, 16);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 32px Inter, sans-serif';
      ctx.fillText('I', 102, 62);
      ctx.fillText('MOVIES', 155, 62);

      // City Pill
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.roundRect(330, 26, 170, 48, 24);
      ctx.fill();
      ctx.fillStyle = '#f43f5e';
      ctx.font = 'bold 20px Inter, sans-serif';
      ctx.fillText('📍', 345, 57);
      ctx.fillStyle = '#e2e8f0';
      ctx.fillText('Mumbai', 380, 57);

      // Search Bar
      ctx.fillStyle = '#0f172a';
      ctx.strokeStyle = '#334155';
      ctx.beginPath();
      ctx.roundRect(540, 26, 450, 48, 16);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#64748b';
      ctx.font = '18px Inter, sans-serif';
      ctx.fillText('🔍 Search movies, actors, directors...', 565, 57);

      // Nav Links
      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 20px Inter, sans-serif';
      ctx.fillText('Movies', 1400, 58);
      ctx.fillStyle = '#94a3b8';
      ctx.fillText('🎟️ My Tickets', 1520, 58);

      // User Profile Pill
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.roundRect(1700, 26, 140, 48, 24);
      ctx.fill();
      ctx.fillStyle = '#f43f5e';
      ctx.beginPath();
      ctx.arc(1728, 50, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 16px Inter, sans-serif';
      ctx.fillText('R', 1722, 56);
      ctx.fillText('Rachit', 1754, 56);
    }

    // Draw Simulated Cursor
    function drawCursor(x, y, isClicking = false) {
      ctx.save();
      ctx.translate(x, y);

      if (isClicking) {
        ctx.strokeStyle = 'rgba(244, 63, 94, 0.6)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, 0, 24, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#020617';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, 26);
      ctx.lineTo(7, 20);
      ctx.lineTo(16, 28);
      ctx.lineTo(21, 23);
      ctx.lineTo(12, 16);
      ctx.lineTo(20, 14);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    // Scene 1: Hero Banner & Spotlight (0 - 15s)
    function renderHeroScene(t) {
      // Background Hero Poster
      if (odysseyBanner.complete && odysseyBanner.naturalWidth) {
        ctx.drawImage(odysseyBanner, 80, 140, 1760, 680);
      } else {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(80, 140, 1760, 680);
      }

      // Gradients overlay
      const grad = ctx.createLinearGradient(80, 140, 80, 820);
      grad.addColorStop(0, 'rgba(2, 6, 23, 0.4)');
      grad.addColorStop(0.6, 'rgba(2, 6, 23, 0.8)');
      grad.addColorStop(1, '#020617');
      ctx.fillStyle = grad;
      ctx.fillRect(80, 140, 1760, 680);

      // Hero Content
      ctx.fillStyle = 'rgba(244, 63, 94, 0.2)';
      ctx.strokeStyle = 'rgba(244, 63, 94, 0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(140, 360, 240, 40, 20);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#fb7185';
      ctx.font = 'bold 16px Inter, sans-serif';
      ctx.fillText('✨ SPOTLIGHT PREMIERE', 165, 386);

      ctx.fillStyle = '#ffffff';
      ctx.font = '900 68px Inter, sans-serif';
      ctx.fillText('The Odyssey', 140, 460);

      ctx.fillStyle = '#f59e0b';
      ctx.font = 'bold 22px Inter, sans-serif';
      ctx.fillText('★ 9.2 (48.2k)', 140, 510);
      ctx.fillStyle = '#cbd5e1';
      ctx.font = '22px Inter, sans-serif';
      ctx.fillText(' •  2h 48m  •  UA  •  English, Hindi, Tamil', 280, 510);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '22px Inter, sans-serif';
      ctx.fillText('An epic cinematic journey tracing Odysseus’ legendary voyage home after the Trojan War,', 140, 560);
      ctx.fillText('battling mythological beasts and vengeful gods in an audiovisual masterpiece.', 140, 595);

      // Book Tickets CTA Button
      const buttonScale = t > 10 ? 1.05 : 1.0;
      ctx.fillStyle = '#e11d48';
      ctx.shadowColor = 'rgba(225, 29, 72, 0.5)';
      ctx.shadowBlur = 25;
      ctx.beginPath();
      ctx.roundRect(140, 650, 260 * buttonScale, 64 * buttonScale, 20);
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 24px Inter, sans-serif';
      ctx.fillText('🎟️  Book tickets', 180, 690);

      // Animated cursor moving toward "Book tickets"
      const cursorX = 800 - easeInOutQuad(Math.min(t / 12, 1)) * 520;
      const cursorY = 400 + easeInOutQuad(Math.min(t / 12, 1)) * 280;
      drawCursor(cursorX, cursorY, t > 13);
    }

    // Scene 2: Discovery & Filters (15 - 30s)
    function renderDiscoveryScene(t) {
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 38px Inter, sans-serif';
      ctx.fillText('🏆 Curated Popular Rankings', 80, 160);

      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 18px Inter, sans-serif';
      ctx.fillText('ℹ️ Curated Editor Sample Ranking (Not real-time metrics)', 640, 158);

      // 4 Ranked Cards
      const ranked = [
        { title: 'The Odyssey', rating: '9.2', img: odysseyPoster },
        { title: 'Dhurandhar', rating: '8.8', img: dhurandharPoster },
        { title: 'Interstellar', rating: '9.4', img: interstellarPoster },
      ];

      ranked.forEach((m, idx) => {
        const x = 80 + idx * 420;
        ctx.fillStyle = '#0f172a';
        ctx.strokeStyle = idx === 0 && t > 8 ? '#f43f5e' : '#1e293b';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(x, 200, 380, 480, 24);
        ctx.fill();
        ctx.stroke();

        if (m.img.complete && m.img.naturalWidth) {
          ctx.drawImage(m.img, x + 20, 220, 340, 320);
        }

        ctx.fillStyle = '#f59e0b';
        ctx.font = 'bold 22px Inter, sans-serif';
        ctx.fillText(`#${idx + 1} ★ ${m.rating}`, x + 25, 580);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 26px Inter, sans-serif';
        ctx.fillText(m.title, x + 25, 620);
      });

      // Filter Bar below
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.roundRect(80, 720, 1760, 90, 20);
      ctx.fill();

      const genres = ['All', 'Action', 'Sci-Fi', 'Adventure', 'Drama', 'Thriller'];
      genres.forEach((g, idx) => {
        const gx = 120 + idx * 160;
        ctx.fillStyle = idx === 1 ? '#e11d48' : '#1e293b';
        ctx.beginPath();
        ctx.roundRect(gx, 742, 140, 46, 23);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 18px Inter, sans-serif';
        ctx.fillText(g, gx + 42, 772);
      });

      // Moving cursor
      const cx = 300 + Math.sin(t * 1.5) * 300;
      const cy = 400 + Math.cos(t * 1.2) * 150;
      drawCursor(cx, cy, Math.sin(t * 3) > 0.8);
    }

    // Scene 3: Movie Details & Showtime Selection (30 - 48s)
    function renderMovieDetailsScene(t) {
      // In-app modal backdrop
      ctx.fillStyle = 'rgba(2, 6, 23, 0.85)';
      ctx.fillRect(0, 0, 1920, 1080);

      // Modal Card
      ctx.fillStyle = '#0b1120';
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(260, 130, 1400, 860, 32);
      ctx.fill();
      ctx.stroke();

      // Movie Header inside Modal
      if (odysseyBanner.complete && odysseyBanner.naturalWidth) {
        ctx.drawImage(odysseyBanner, 260, 130, 1400, 320);
      }
      ctx.fillStyle = 'rgba(11, 17, 32, 0.7)';
      ctx.fillRect(260, 130, 1400, 320);

      ctx.fillStyle = '#ffffff';
      ctx.font = '900 48px Inter, sans-serif';
      ctx.fillText('The Odyssey (Laser IMAX 3D)', 320, 380);

      ctx.fillStyle = '#f43f5e';
      ctx.font = 'bold 22px Inter, sans-serif';
      ctx.fillText('Select Showtime • PVR ICON Palladium, Mumbai', 320, 420);

      // Date selector pills
      ['Today, 26 Oct', 'Tomorrow, 27 Oct', 'Wed, 28 Oct'].forEach((d, i) => {
        const dx = 320 + i * 220;
        ctx.fillStyle = i === 0 ? '#e11d48' : '#1e293b';
        ctx.beginPath();
        ctx.roundRect(dx, 480, 200, 52, 16);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 18px Inter, sans-serif';
        ctx.fillText(d, dx + 30, 513);
      });

      // Multiplex Theatres
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.roundRect(320, 560, 1280, 380, 24);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 26px Inter, sans-serif';
      ctx.fillText('PVR ICON: Phoenix Palladium, Lower Parel', 360, 610);
      ctx.fillStyle = '#94a3b8';
      ctx.font = '18px Inter, sans-serif';
      ctx.fillText('Facilities: Laser IMAX • Dolby Atmos • Gourmet Lounge', 360, 640);

      // Showtimes
      const times = [
        { time: '10:30 AM', fmt: 'Laser IMAX' },
        { time: '02:15 PM', fmt: 'Dolby Atmos 2D' },
        { time: '06:45 PM', fmt: 'Laser IMAX' },
        { time: '10:00 PM', fmt: 'Dolby Atmos 2D' },
      ];

      times.forEach((st, idx) => {
        const sx = 360 + idx * 220;
        const isSelected = idx === 2; // 06:45 PM
        ctx.fillStyle = isSelected && t > 10 ? '#e11d48' : '#0f172a';
        ctx.strokeStyle = isSelected ? '#f43f5e' : '#334155';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(sx, 680, 190, 80, 18);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px Inter, sans-serif';
        ctx.fillText(st.time, sx + 38, 718);
        ctx.fillStyle = isSelected && t > 10 ? '#ffe4e6' : '#94a3b8';
        ctx.font = '14px Inter, sans-serif';
        ctx.fillText(st.fmt, sx + 42, 744);
      });

      // Animated cursor moving to click 06:45 PM
      const cx = 500 + easeInOutQuad(Math.min(t / 12, 1)) * 360;
      const cy = 600 + easeInOutQuad(Math.min(t / 12, 1)) * 120;
      drawCursor(cx, cy, t > 10);
    }

        for (let c = 1; c <= 12; c++) {

          } else if (isBooked) {

          } else {

            ctx.shadowBlur = 0;
          }

          ctx.beginPath();
          ctx.roundRect(cx, ry, 48, 44, 10);
          ctx.fill();
          ctx.shadowBlur = 0;

          ctx.fillStyle = isSelected ? '#ffffff' : (isBooked ? '#475569' : '#94a3b8');

          ctx.fillText(c.toString(), cx + (c >= 10 ? 12 : 18), ry + 28);

      ctx.strokeStyle = '#1e293b';

      ctx.beginPath();

      ctx.fillText('Base: ₹560 + Convenience Fee & GST: ₹70.80', 300, 805);

      ctx.fillStyle = '#ffffff';

      ctx.fillText(t > 8 ? '₹630.80' : '₹0.00', 1240, 785);

      // Proceed to checkout button
      ctx.fillStyle = '#e11d48';
      ctx.beginPath();
      ctx.roundRect(1420, 745, 210, 56, 16);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 20px Inter, sans-serif';
      ctx.fillText('Checkout →', 1465, 780);

      // Cursor clicks C5 then C6 then Checkout

    }

    // Animation Loop
    function updatePlayback(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      if (isPlaying) {
        currentSeconds += delta;
        if (currentSeconds >= TOTAL_SECONDS) {
          currentSeconds = TOTAL_SECONDS;
          pause();
        }
        timeSlider.value = (currentSeconds / TOTAL_SECONDS) * 100;
        currentTimeEl.innerText = formatTime(currentSeconds);
      }

      renderFrame(currentSeconds);

      if (isPlaying) {
        animationFrameId = requestAnimationFrame(updatePlayback);
      }
    }

    function play() {
      if (currentSeconds >= TOTAL_SECONDS) currentSeconds = 0;
      isPlaying = true;
      playPauseText.innerText = 'Pause';
      playPauseIcon.innerText = '⏸';
      playOverlay.classList.add('opacity-0', 'pointer-events-none');
      lastTimestamp = performance.now();
      playBeep(440, 0.1);
      animationFrameId = requestAnimationFrame(updatePlayback);
    }

    function pause() {
      isPlaying = false;
      playPauseText.innerText = 'Play Demo';
      playPauseIcon.innerText = '▶';
      playOverlay.classList.remove('opacity-0', 'pointer-events-none');
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
    }

    playPauseBtn.addEventListener('click', () => {
      if (isPlaying) pause();
      else play();
    });

    bigPlayBtn.addEventListener('click', play);
    playOverlay.addEventListener('click', play);

    restartBtn.addEventListener('click', () => {
      currentSeconds = 0;
      timeSlider.value = 0;
      currentTimeEl.innerText = '00:00';
      play();
    });

    timeSlider.addEventListener('input', (e) => {
      currentSeconds = (e.target.value / 100) * TOTAL_SECONDS;
      currentTimeEl.innerText = formatTime(currentSeconds);
      renderFrame(currentSeconds);
    });

    document.querySelectorAll('.chapter-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const t = parseFloat(btn.dataset.time);
        currentSeconds = t;
        timeSlider.value = (t / TOTAL_SECONDS) * 100;
        currentTimeEl.innerText = formatTime(t);
        play();
      });
    });

    // ========================================================
    // VIDEO EXPORT ENGINE (Records Canvas Stream to .webm File)
    // ========================================================
    downloadVideoBtn.addEventListener('click', async () => {
      if (isRecording) {
        stopRecording();
        return;
      }

      try {
        recordStatusText.innerText = 'Recording Video...';
        downloadVideoBtn.classList.replace('from-emerald-600', 'from-rose-600');
        downloadVideoBtn.classList.replace('to-teal-600', 'to-rose-700');

        const stream = canvas.captureStream(30); // 30 FPS High Quality
        recordedChunks = [];

        const options = { mimeType: 'video/webm;codecs=vp9' };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) {
          options.mimeType = 'video/webm';
        }

        mediaRecorder = new MediaRecorder(stream, options);

        mediaRecorder.ondataavailable = (event) => {
          if (event.data && event.data.size > 0) {
            recordedChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.style.display = 'none';
          a.href = url;
          a.download = 'imovies-demo-walkthrough.webm';
          document.body.appendChild(a);
          a.click();
          setTimeout(() => {
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
          }, 100);

          recordStatusText.innerText = 'Download Video (.webm)';
          downloadVideoBtn.classList.replace('from-rose-600', 'from-emerald-600');
          downloadVideoBtn.classList.replace('to-rose-700', 'to-teal-600');
          isRecording = false;
        };

        isRecording = true;
        mediaRecorder.start();

        // Run entire demo from 0s to 90s at fast recording speed
        currentSeconds = 0;
        play();
      } catch (err) {
        alert('Could not start recording: ' + err.message);
        recordStatusText.innerText = 'Download Video (.webm)';
        isRecording = false;
      }
    });

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        pause();
      }
    }

    // Initial first frame render
    renderFrame(0);
  </script>
