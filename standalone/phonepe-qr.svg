    <rect x="210" y="210" width="12" height="12" rx="2" fill="#334155"/>

    <rect x="80" y="235" width="12" height="12" rx="2" fill="#334155"/>
    <rect x="105" y="235" width="12" height="12" rx="2" fill="#334155"/>
    <rect x="135" y="235" width="12" height="12" rx="2" fill="#334155"/>
    <rect x="165" y="235" width="12" height="12" rx="2" fill="#334155"/>
    <rect x="195" y="235" width="12" height="12" rx="2" fill="#334155"/>
    <rect x="225" y="235" width="12" height="12" rx="2" fill="#334155"/>

    <!-- Center PhonePe Badge -->
    <rect x="98" y="98" width="54" height="54" rx="12" fill="#ffffff" stroke="#5f259f" stroke-width="2"/>
    <circle cx="125" cy="125" r="18" fill="#5f259f"/>
    <text x="125" y="132" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="19" fill="#ffffff" text-anchor="middle">पे</text>
  </g>

  <!-- Bottom Supported Apps Bar -->
  <g transform="translate(0, 435)">
    <text x="200" y="12" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#64748b" text-anchor="middle">Scan with any UPI App: PhonePe • Google Pay • Paytm • BHIM</text>
  </g>
